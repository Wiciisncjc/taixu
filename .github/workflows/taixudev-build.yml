name: Build TaiXuDev APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional Release Tag (e.g. v0.2.1-dev)'
        required: false
        default: ''

jobs:
  build:
    name: Build & Package TaiXuDev
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      # release_tag 会进入 softprops/action-gh-release 的 tag_name / name。
      # 经 env 传入，避免 ${{ }} 直接拼进 shell。空值与纯空白表示不创建 Release；
      # 其余必须整段匹配 ReleaseTagValidator 的形状：v<主>.<次>.<补丁>[-后缀]，
      # 后缀仅字母、数字、点、连字符。下划线（如 v1.0.0_rc1）故意拒绝。
      # 非法输入在构建之前失败关闭；Release 步骤只消费这里写出的已校验 tag。
      - name: Validate release tag
        id: release_tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          tag="$RELEASE_TAG"
          if [[ "$tag" =~ ^[[:space:]]*$ ]]; then
            echo "create=false" >> "$GITHUB_OUTPUT"
            echo "release_tag is empty; GitHub Release will not be created"
            exit 0
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid release_tag. Expected v<major>.<minor>.<patch>[-suffix] (letters, digits, dot, hyphen). Underscores are rejected."
            exit 1
          fi
          echo "create=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 'tools' 包已于 2026-09 被 Google 下线，不能再用默认值（tools platform-tools）
          # 参考 https://github.com/android-actions/setup-android/issues/537
          packages: 'platform-tools'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build TaiXuDev APK
        env:
          TAIXU_DEV_BUILD: "1"
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Identify and Rename Output APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output

          # 只接受 :app 的 debug 主包，排除 androidTest / benchmark 等旁路产物，
          # 避免 head -n 1 在多变体下静默选中错误文件。
          mapfile -t CANDIDATES < <(
            find app/build/outputs/apk -name "*.apk" \
              -not -name "*androidTest*" -not -name "*benchmark*" | sort
          )
          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            echo "::error::No APK generated!"
            exit 1
          fi
          if [ "${#CANDIDATES[@]}" -gt 1 ]; then
            printf 'candidates:\n%s\n' "$(printf '  %s\n' "${CANDIDATES[@]}")"
            echo "::error::Expected exactly one :app debug APK, got ${#CANDIDATES[@]}"
            exit 1
          fi
          APK_PATH="${CANDIDATES[0]}"
          echo "selected: $APK_PATH"

          # TAIXU_DEV_BUILD=1 必须真正生效：校验包名 / 应用名 / ABI，
          # 否则产物会顶着 TaiXuDev 的文件名却带着正式版的身份。
          AAPT2=""
          for root in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk; do
            [ -n "$root" ] && [ -d "$root/build-tools" ] || continue
            found=$(find "$root/build-tools" -type f -name aapt2 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$found" ]; then AAPT2="$found"; break; fi
          done
          if [ -z "$AAPT2" ]; then
            AAPT2=$(command -v aapt2 || true)
          fi
          if [ -z "$AAPT2" ]; then
            echo "::error::aapt2 not found; cannot verify APK identity"
            exit 1
          fi
          echo "aapt2: $AAPT2"
          BADGING=$("$AAPT2" dump badging "$APK_PATH")

          EXPECTED_PACKAGE="top.wkbin.taixu.dev"
          EXPECTED_LABEL="TaiXuDev"
          ACTUAL_PACKAGE=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$BADGING")
          ACTUAL_LABEL=$(sed -n "s/^application-label:'\([^']*\)'.*/\1/p" <<<"$BADGING" | head -n 1)
          ACTUAL_ABI=$(sed -n "s/^native-code: '\([^']*\)'.*/\1/p" <<<"$BADGING" | head -n 1)

          echo "package: $ACTUAL_PACKAGE"
          echo "label:   $ACTUAL_LABEL"
          echo "abi:     $ACTUAL_ABI"

          if [ "$ACTUAL_PACKAGE" != "$EXPECTED_PACKAGE" ]; then
            echo "::error::Unexpected applicationId '$ACTUAL_PACKAGE' (expected '$EXPECTED_PACKAGE'); TAIXU_DEV_BUILD did not take effect"
            exit 1
          fi
          if [ "$ACTUAL_LABEL" != "$EXPECTED_LABEL" ]; then
            echo "::error::Unexpected application label '$ACTUAL_LABEL' (expected '$EXPECTED_LABEL')"
            exit 1
          fi
          if [ "$ACTUAL_ABI" != "arm64-v8a" ]; then
            echo "::error::Unexpected native-code '$ACTUAL_ABI' (expected 'arm64-v8a')"
            exit 1
          fi

          cp "$APK_PATH" output/TaiXuDev-arm64-debug.apk
          # 校验文件只写裸文件名：下载到任意目录后可直接 `sha256sum -c`。
          ( cd output && sha256sum TaiXuDev-arm64-debug.apk > TaiXuDev-arm64-debug.apk.sha256 )
          echo "APK ready: output/TaiXuDev-arm64-debug.apk"

      - name: Upload TaiXuDev APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: taixudev-apk
          path: output/*
          retention-days: 7

      - name: Create GitHub Release (Optional)
        if: steps.release_tag.outputs.create == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.release_tag.outputs.tag }}"
          name: "TaiXuDev Preview ${{ steps.release_tag.outputs.tag }}"
          files: output/*
          draft: false
          prerelease: true
